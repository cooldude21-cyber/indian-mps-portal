<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Parliament Members Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; color: #ffffff; background-color: #071f22; background-image: radial-gradient(circle at 70% 30%, #8f4027 0px, transparent 40%), radial-gradient(circle at 20% 80%, #0d4440 0px, transparent 50%), radial-gradient(circle at 50% 100%, #176057 0px, transparent 60%); background-attachment: fixed; min-height: 100vh; }
        header { padding: 40px 20px 20px; text-align: center; }
        header h1 { font-family: 'Montserrat', sans-serif; margin: 0; font-size: 45px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        header p { color: rgba(255,255,255,0.7); font-weight: 300; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .search-box { width: 100%; padding: 20px 25px; font-size: 18px; color: #fff; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50px 15px 15px 15px; margin-bottom: 25px; box-sizing: border-box; outline: none; backdrop-filter: blur(15px); font-family: 'Poppins', sans-serif; }
        .search-box::placeholder { color: rgba(255, 255, 255, 0.5); font-weight: 300; }
        .search-box:focus { border-color: #fff; background: rgba(255, 255, 255, 0.1); }
        .tabs { display: flex; gap: 15px; margin-bottom: 40px; }
        .tab { padding: 12px 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); cursor: pointer; border-radius: 12px; font-size: 16px; font-weight: 600; color: #fff; transition: 0.3s; backdrop-filter: blur(5px); }
        .tab.active, .tab:hover { background: rgba(255,255,255,0.2); border-color: #fff; }
        .mp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .mp-card { padding: 30px 25px; text-align: center; transition: 0.4s ease; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 80px 15px 15px 15px; box-shadow: inset 0 0 20px rgba(255,255,255,0.05), 0 15px 35px rgba(0,0,0,0.3); position: relative; overflow: hidden; }
        .mp-card:hover { transform: translateY(-10px); border-color: rgba(255,255,255,0.5); }
        .mp-card img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8); margin-bottom: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .mp-name { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 800; margin: 0 0 10px; text-transform: uppercase; }
        .mp-party { display: inline-block; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 1px; margin-bottom: 15px; }
        .portfolio-btn { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.5); padding: 12px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; width: 100%; transition: 0.3s; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; font-family: 'Poppins', sans-serif; }
        .portfolio-btn:hover { background: #fff; color: #071f22; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); overflow-y: auto; padding: 40px 20px; box-sizing: border-box; }
        .modal-content { max-width: 900px; margin: 0 auto; padding: 50px; position: relative; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 150px 20px 20px 20px; box-shadow: inset 0 0 20px rgba(255,255,255,0.05), 0 20px 50px rgba(0,0,0,0.5); animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .accent-bar { position: absolute; top: 0; right: 60px; width: 40px; height: 250px; background-color: #9e4c35; z-index: 1; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .close-btn { position: absolute; right: 20px; top: 20px; font-size: 35px; color: rgba(255,255,255,0.5); cursor: pointer; transition: 0.3s; z-index: 10; font-family: sans-serif; }
        .close-btn:hover { color: #fff; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 40px; position: relative; z-index: 2; margin-bottom: 20px; }
        .modal-left img { width: 100%; max-width: 350px; border-radius: 20px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); }
        .modal-right { padding-top: 20px; padding-right: 40px; }
        .modal-right h4 { font-family: 'Montserrat', sans-serif; margin-top: 0; letter-spacing: 2px; color: #9e4c35; font-size: 14px; text-transform: uppercase; }
        .modal-right p { font-size: 15px; line-height: 1.8; color: rgba(255,255,255,0.85); font-weight: 300; }
        .massive-title { font-family: 'Montserrat', sans-serif; font-size: 90px; font-weight: 900; text-transform: uppercase; line-height: 0.9; margin-top: 20px; color: #ffffff; text-shadow: 0 15px 30px rgba(0,0,0,0.4); position: relative; z-index: 3; word-wrap: break-word; }
        .info-strip { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; }
        .info-item { background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .info-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-bottom: 3px; }
        .info-value { font-size: 14px; font-weight: 600; color: #fff; }
        @media (max-width: 800px) { .modal-grid { grid-template-columns: 1fr; } .massive-title { font-size: 50px; } .accent-bar { right: 20px; width: 25px; height: 150px; } .modal-content { border-radius: 100px 15px 15px 15px; padding: 30px; } }
    </style>
</head>
<body>

<header>
    <h1>Indian MPs</h1>
    <p>Database & Portfolios (1947 - Current)</p>
</header>

<div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="Search by name, constituency, or party..." onkeyup="searchMPs()">

    <div class="tabs">
        <button class="tab active" onclick="filterData('MP', this)">Current MPs</button>
        <button class="tab" onclick="filterData('All', this)">All MPs</button>
    </div>

    <div class="mp-grid" id="mpContainer">
        <p style="text-align: center; width: 100%;">ডেটা লোড হচ্ছে...</p>
    </div>
</div>

<div id="portfolioModal" class="modal">
    <div class="modal-content">
        <div class="accent-bar"></div>
        <span class="close-btn" onclick="closeModal()">&times;</span>
        
        <div class="modal-grid">
            <div class="modal-left">
                <img id="modalImg" src="" alt="MP Photo">
            </div>
            <div class="modal-right">
                <h4>Biography:</h4>
                <p id="modalBio">Loading details...</p>
                
                <div class="info-strip">
                    <div class="info-item"><div class="info-label">Constituency</div><div class="info-value" id="modalConstituency">-</div></div>
                    <div class="info-item"><div class="info-label">Party</div><div class="info-value" id="modalParty">-</div></div>
                    <div class="info-item"><div class="info-label">Assets</div><div class="info-value" id="modalAssets">-</div></div>
                    <div class="info-item"><div class="info-label">Criminal Cases</div><div class="info-value" id="modalCriminal">-</div></div>
                </div>
            </div>
        </div>

        <div class="massive-title" id="modalName">
            NAME<br>HERE
        </div>
    </div>
</div>

<script>
    let allMPs = [];
    let currentFilter = 'MP'; 

    async function fetchMPData() {
        try {
            const response = await fetch('mps.json');
            allMPs = await response.json();
            displayMPs(allMPs.filter(mp => mp.type === 'MP'));
        } catch (error) {
            document.getElementById('mpContainer').innerHTML = "<p style='color:#ffcccb; text-align:center;'>ডেটা লোড করতে সমস্যা হচ্ছে।</p>";
        }
    }

    function displayMPs(mps) {
        const container = document.getElementById('mpContainer');
        container.innerHTML = '';
        
        if(mps.length === 0) {
            container.innerHTML = '<p style="text-align:center;">কোনো তথ্য পাওয়া যায়নি।</p>';
            return;
        }

        mps.forEach(mp => {
            const card = document.createElement('div');
            card.className = 'mp-card';
            let displayImage = mp.image ? mp.image : 'https://via.placeholder.com/150/0d4440/ffffff?text=Loading...';
            
            card.innerHTML = `
                <img src="${displayImage}" id="img-grid-${mp.id}" alt="${mp.name}" onerror="this.src='https://via.placeholder.com/150/0d4440/ffffff?text=No+Image'">
                <div class="mp-name">${mp.name}</div>
                <div class="mp-party">${mp.party}</div>
                <p style="font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 20px; font-weight: 300;">${mp.shortBio || mp.constituency}</p>
                <button class="portfolio-btn" onclick="openModal('${mp.id}')">View Details</button>
            `;
            container.appendChild(card);

            if(!mp.image) {
                fetchWikipediaData(mp.name, mp.id, false);
            }
        });
    }

    function filterData(type, btnElement) {
        currentFilter = type;
        document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        searchMPs();
    }

    function searchMPs() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allMPs.filter(mp => {
            const matchesSearch = mp.name.toLowerCase().includes(query) || 
                                  mp.constituency.toLowerCase().includes(query) || 
                                  mp.party.toLowerCase().includes(query);
            const matchesTab = currentFilter === 'All' ? true : mp.type === currentFilter;
            return matchesSearch && matchesTab;
        });
        displayMPs(filtered);
    }

    async function fetchWikipediaData(mpName, id, isModal) {
        try {
            const url = \`https://en.wikipedia.org/w/api.php?action=query&titles=\${encodeURIComponent(mpName)}&prop=extracts|pageimages&exintro&explaintext&pithumbsize=500&format=json&origin=*\`;
            const response = await fetch(url);
            const data = await response.json();
            const pages = data.query.pages;
            const pageId = Object.keys(pages)[0];
            
            if (pageId !== "-1") {
                const pageData = pages[pageId];
                
                if (isModal) {
                    if (pageData.thumbnail && document.getElementById('modalImg').src.includes('placeholder')) {
                        document.getElementById('modalImg').src = pageData.thumbnail.source;
                    }
                    if (pageData.extract && document.getElementById('modalBio').innerText.includes('Wikipedia')) {
                        document.getElementById('modalBio').innerText = pageData.extract.substring(0, 500) + '... (Source: Wikipedia)';
                    }
                } else {
                    if (pageData.thumbnail) {
                        document.getElementById(\`img-grid-\${id}\`).src = pageData.thumbnail.source;
                        const mpIndex = allMPs.findIndex(m => m.id === id);
                        if(mpIndex !== -1) allMPs[mpIndex].image = pageData.thumbnail.source;
                    }
                }
            }
        } catch (error) {
            console.log("Wikipedia data not found for:", mpName);
        }
    }

    function openModal(id) {
        const mp = allMPs.find(m => m.id === id);
        if(!mp) return;

        document.getElementById('modalImg').src = mp.image || 'https://via.placeholder.com/400/0d4440/ffffff?text=Searching+Image...';
        
        const nameParts = mp.name.split(' ');
        if(nameParts.length > 1) {
            document.getElementById('modalName').innerHTML = \`\${nameParts[0]}<br>\${nameParts.slice(1).join(' ')}\`;
        } else {
            document.getElementById('modalName').innerText = mp.name;
        }

        document.getElementById('modalParty').innerText = mp.party;
        document.getElementById('modalConstituency').innerText = \`\${mp.constituency}\`;
        document.getElementById('modalAssets').innerText = mp.assets || 'Check MyNeta';
        document.getElementById('modalCriminal').innerText = mp.criminalCases || '0';
        document.getElementById('modalBio').innerText = mp.detailedBio || 'Detailed biography is not available. Searching Wikipedia...';

        document.getElementById('portfolioModal').style.display = 'block';
        document.body.style.overflow = 'hidden'; 
        
        if(!mp.detailedBio || !mp.image) {
            fetchWikipediaData(mp.name, mp.id, true);
        }
    }

    function closeModal() {
        document.getElementById('portfolioModal').style.display = 'none';
        document.body.style.overflow = 'auto'; 
    }

    window.onclick = function(event) {
        const modal = document.getElementById('portfolioModal');
        if (event.target == modal) {
            closeModal();
        }
    }

    window.onload = fetchMPData;
</script>

</body>
</html>
